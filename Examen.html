<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Barra de navegación fija -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <div class="row w-100 align-items-center">
                
                <!-- Logo -->
                <div class="col-md-1">
                    <div class="card-body">
                        <div align="left">
                            <img src="logo.jpg" class="img-fluid" alt="Logo el rincon de las pizzas">
                        </div>
                    </div>
                </div>

                <!-- Botones a la derecha -->
                <div class="col-auto ms-auto">
                    <button class="btn btn-outline-light" ">Boton</button>
                    
                </div>
            </div>
        </div>
    </nav>

    <header class=" text-white text-center py-5" style=" margin-top: 80px;">
        <h1 style="color: black;">Titulo</h1>
    </header>

    <div class="container mt-4">
        <div class="card p-4">
            <h2 class="text-center">Formulario de Contacto</h2>
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingrese su correo">
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="3" placeholder="Escriba su mensaje"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>
    
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p>Síguenos en nuestras redes sociales:</p>
        <a href="https://www.facebook.com" class="text-white mx-2" target="_blank">Facebook</a>
        <a href="https://www.instagram.com" class="text-white mx-2" target="_blank">Instagram</a>
    </footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
